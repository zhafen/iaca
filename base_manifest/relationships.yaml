# Relationship components
link:
    - description: >
          A component that describes a generic link between two entities.
    - component
    - fields:
          source [entity]: The source entity.
          target [entity]: The target entity.
          link_type [entity]: The type of link.

semantic_triplet:
    - description: >
          Another way to describe links, consisting of
          subject (source) -> predicate (link_type) -> object (target), e.g.
          function_a -> depends_on -> function_b
    - fields:
          subject [entity]: The subject (source) entity.
          predicate [entity]: The predicate (link_type) entity.
          object [entity]: The object (target) entity.

node:
    - description: A component describing an entity in the context of the entity as a node.
    - component:
          multiplicity: '0..1'
    - fields:
          connected_component_group [int]: >
              Which collection of components this node is connected to.

links:
    - description: >
          A description of multiple links, using the syntax:
              source --> target
              second_source --> second_target
    - component
    - fields:
          value [str]: >
              A string that describes the edges, following the format "{source} --> {target}"
              with linebreaks separating different links.
          link_type [entity]:
              description: >
                  The type of the links. Must be a component that has either a source and target
                  component or a link component.
              default: depended_on_by

link_type:
    - description: >
          If a [compdef] entity owns a [link_type] component then the component represents
          a pairwise relationship. Such [compdef] entities all have a "value" field of
          type [entity] that is the "target" and any owners of such a component are
          the "source".
    - component:
          multiplicity: '0..1'
    - fields:
          directed [bool] = True: Whether or not the link is directed.
          reverse [entity]: The link_type for the reverse direction.
          plural [str]: The term used for multiple of the link type.
    - todo:
          value: Get rid of reverse relations and just use the primary one.
          priority: 0.1

related:
    - description: >
          The most general type of relationship. This component type doesn't specify any
          additional information about the details of the relationship,
          just that there is one.
    - component
    - fields:
          value [entity]: The related entity.
          description [str]: A description of the relationship.

child:
    - description: The target entity is the child of the source entity.
    - component
    - link_type:
          reverse: parent
    - fields:
          value [entity]: The child entity to the owner entity.
    - todo:
          value: >
              Currently child links are used for both specifications of the parent (i.e. 
              inheritance) and pieces of the parent (i.e. components). The relationship
              between those two use cases and how to work with them in the system should
              be reconciled.
          priority: 0.1
    - todo:
            value: >
                Honestly, components are the alternative to inheritance, so we
                should be careful about mixing and matching. Components that are
                specifications of other components is maybe a bad idea? But what
                about an alternate version where children inherit the same components
                as their parents? How does that relate to requirements as children
                of parent requirements? It could work well because you just set the
                a single requirement component for the root level that points to the
                right infrastructure, and then all children inherit.
            priority: 0.8
    - specifications:
          specification:
              - description: >
                    The target entity is a specification of the source entity, i.e. the target
                    inherits from the source.
              - link_type:
                    reverse: specification_of
                    plural: specifications
          subset:
              - description: >
                    The target entity is a subset of the source entity, i.e. the target is one
                    piece of what makes the source entity whole. This relationship
                    is closely related to [component]s.
              - link_type:
                    reverse: subset_of
                    plural: subsets

parent:
    - description: The target entity is the parent of the source entity.
    - component
    - link_type:
          reverse: child
    - fields:
          value [entity]: The parent entity to the owner entity.
    - todo: >
          Reverse this with child, since that produces a graph with more-consistent
          terminology.

depends_on:
    - description: The source entity depends on the target entity.
    - component
    - link_type:
          reverse: depended_on_by
    - fields:
          value [entity]: The entity the owner entity depends on.

depended_on_by:
    - description: The source entity is depended on by the target entity.
    - component
    - link_type:
          reverse: depends_on
    - fields:
          value [entity]: The entity the owner entity is depended on by.

transformation_of:
    - description: >
          The source entity is a transformation of the target entity, i.e. the underlying
          data is the same to within the limitations of the representations.
    - component
    - link_type:
          directed: False
    - fields:
          value [entity]: The entity the owner entity is a transformation of.

affiliated:
    - description: >
          The source entity and the target entity are part of the same group.
    - component
    - link_type:
          directed: False
    - fields:
          value [entity]: The entity the owner entity is affiliated with.
          always [bool]: >
              If True, the target entity is always affiliated with the source entity, even if
              not explicitly stated.

child_component:
    - description: >
          A tag indicating that components of this type have hierarchical parent-child
          relationships with their entities. Python components are one such example.
    - todo: >
          Consider if we can roll this up into a more general solution. For example,
          we might include a "default_components" component for component definitions.
          In fact, this is degenerate with [specification].
    - component

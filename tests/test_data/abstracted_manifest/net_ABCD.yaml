meta:
    - description: |
          Various ways to describe a network in component form. The network consists of
          nodes A, B, C, D and links AB (type alpha), AC (type alpha), and AD
          (type beta, beta value: 1).

numeric_link:
- description: Defined for test purposes, has a fourth field that's a numeric value.
- component
- fields:
    value: The numeric value.
    source:
    target:
    link_type:

numeric_link_to_link_and_link_value:
- entity_transformer:
    input: numeric_link
    output: [link, link_value]
- mapping:
    link:
        source: numeric_link.source
        target: numeric_link.target
        link_type: numeric_link.link_type
    link_value: numeric_link.value

net_ABCD:
    - includes:
          - A: [node]
          - B: [node]
          - C: [node]
          - D: [node]
          - AB:
                - numeric_link:
                      source: A
                      target: B
                      link_type: alpha
                      value: 0
          - BC:
                - numeric_link:
                      source: A
                      target: C
                      link_type: alpha
                      value: 0
          - AD:
                - link:
                      source: A
                      target: D
                      link_type: beta
                      value: 0
                - beta: 1

net_ABCD_1:
    - includes:
          - A: [node]
          - B: [node]
          - C: [node]
          - D: [node]
          - AB:
                - link:
                      source: A
                      target: B
                      link_type: alpha
          - BC:
                - link:
                      source: A
                      target: C
                      link_type: alpha
          - AD:
                - minimal_link:
                      source: A
                      target: D
                - beta: 1
                - link_value: 0
    - transform_of: net_ABCD
